<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="source-file" content="{{source_file}}">
  <meta name="source-sha256" content="{{source_hash}}">
  <meta name="generator" content="scripts/gen_html.py">
  <title>{{title}} · 面试题</title>
  <link rel="icon" href="{{favicon}}">
  <style>
{{css}}
  </style>
</head>
<body>
{{icons}}
  <div class="page">
    <header class="page-header">
      <div class="question-page-location"><a class="standalone-home" href="index.html#home">← 学习主页</a><span class="page-id">{{question_id}}</span></div>
      <button type="button" class="button" id="print-page" title="打印题目、我的回答和全部参考答案"><svg class="icon" aria-hidden="true"><use href="#i-print"/></svg>打印</button>
    </header>
    <main>
      <section class="question" aria-labelledby="question-title">
        <div class="question-label">题目</div>
        <h1 id="question-title" class="{{title_class}}">{{title_html}}</h1>
        <div class="question-meta"><span>{{category}}</span><span class="meta-dot" aria-hidden="true"></span><span>{{difficulty}}</span><span class="meta-dot" aria-hidden="true"></span><span>{{role}}</span></div>
{{question_context}}
        <p class="question-instruction">先试着回答，再展开下方的参考答案。</p>
      </section>
      <section class="draft" aria-labelledby="draft-title">
        <div class="draft-header"><h2 id="draft-title"><label for="my-answer">我的回答</label></h2><span class="draft-state" id="draft-state" role="status" aria-live="polite">尚未记录</span></div>
        <textarea id="my-answer" aria-describedby="draft-hint" placeholder="写下你的回答，或先口述，再记录要点……" spellcheck="false"></textarea>
        <div class="draft-footer"><p id="draft-hint">仅保存在当前浏览器，刷新后保留。</p><span id="word-count">0 字</span></div>
        <p class="print-draft" id="print-draft"></p>
      </section>
      <noscript><p class="noscript">参考答案和追答可以直接展开。启用 JavaScript 后可自动保存回答和打印全部答案。</p></noscript>
      <details class="reference-answer" id="reference-answer">
        <summary class="answer-summary">
          <span class="answer-badge" aria-hidden="true">答</span>
          <div><h2>参考答案</h2><p class="answer-summary-description">先独立思考，再点开对照。</p></div>
          <span class="disclosure-action"><span id="answer-toggle-label">展开答案</span><svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"/></svg></span>
        </summary>
        <div class="answer-body">
{{answers}}
{{supplement}}
{{extras}}
        </div>
      </details>
{{followups}}
    </main>
    <footer class="page-footer"><span>{{question_id}} · 单题笔记</span><a href="{{source_url}}" target="_blank" rel="noopener noreferrer">查看题目原文 ↗</a></footer>
  </div>
  <dialog class="media-dialog" id="media-dialog" aria-labelledby="media-title"><div class="media-dialog-header"><h2 id="media-title">图片与流程图</h2><button type="button" class="button" id="close-media">关闭</button></div><div class="media-scroll" id="media-content"></div></dialog>
  <script type="application/json" id="page-data">{{page_data}}</script>
  <script>
{{script}}
  </script>
{{supplement_script}}
</body>
</html>
